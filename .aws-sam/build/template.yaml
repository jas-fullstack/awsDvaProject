AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: User Management API
Resources:
  GetUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetUsersFunction
      Handler: dist/src/handlers/getUsers.handler
      Runtime: nodejs22.x
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:Scan
          Resource:
            Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Users
      Environment:
        Variables:
          USERS_TABLE: Users
      Events:
        GetUsers:
          Type: Api
          Properties:
            Path: /getUsers
            Method: GET
    Metadata:
      SamResourceId: GetUsersFunction
  CreateUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateUsersFunction
      Handler: dist/src/handlers/createUsers.handler
      Runtime: nodejs22.x
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          Resource:
            Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Users
      Environment:
        Variables:
          USERS_TABLE: Users
      Events:
        CreateUsers:
          Type: Api
          Properties:
            Path: /createUsers
            Method: POST
    Metadata:
      SamResourceId: CreateUsersFunction
